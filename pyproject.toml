[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atac-hic-prediction"
version = "1.0.0"
description = "ATAC-informed prediction of short-range cis Hi-C contacts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Lucas Ward"}
]
dependencies = [
  "hic-straw==1.3.1",
  "joblib==1.5.3",
  "matplotlib==3.10.8",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pyBigWig==0.3.25",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
